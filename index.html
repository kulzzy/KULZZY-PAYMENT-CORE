<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#06122a"
>

<title>KULZZY PAYMENT CORE</title>

<script src="https://checkout.flutterwave.com/v3.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06122a;
    color:#fff;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:20px 15px 40px;
}

.header{
    text-align:center;
    padding:25px 10px 20px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:12px;
}

.header h1{
    font-size:30px;
    font-weight:900;
    color:#ffd400;
    margin-bottom:10px;
}

.header p{
    font-size:15px;
    line-height:1.5;
}

.card{
    background:#0b1d3a;
    border:1px solid rgba(255,212,0,.35);
    border-radius:18px;
    padding:22px 17px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.status{
    text-align:center;
    padding:10px 0 18px;
}

.status-badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:20px;
    background:#06122a;
    color:#ffd400;
    border:1px solid rgba(255,212,0,.4);
    font-size:12px;
    font-weight:900;
}

.payment-info{
    background:#06122a;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.payment-info-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.payment-info-row:last-child{
    border-bottom:none;
}

.payment-info-label{
    color:#aaa;
    font-size:13px;
}

.payment-info-value{
    color:#ffd400;
    font-size:14px;
    font-weight:800;
    text-align:right;
    word-break:break-word;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

input{
    width:100%;
    height:54px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:0 14px;
    margin-bottom:20px;
    background:#fff;
    color:#111;
    font-size:16px;
}

input:focus{
    box-shadow:0 0 0 3px rgba(255,212,0,.35);
}

.amount-box{
    position:relative;
}

.amount-box span{
    position:absolute;
    left:15px;
    top:17px;
    color:#555;
    font-weight:700;
    pointer-events:none;
}

.amount-box input{
    padding-left:40px;
}

.pay-button{
    display:block;
    width:100%;
    height:56px;
    border:none;
    border-radius:12px;
    background:#ffd400;
    color:#06122a;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.pay-button:active{
    transform:scale(.98);
}

.pay-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.notice{
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:#aaa;
    margin-top:18px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#ffd400;
    font-size:13px;
    font-weight:700;
}

.error-box{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#35131a;
    border:1px solid #ff5964;
    color:#fff;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.success{
    display:none;
    text-align:center;
    background:#0b1d3a;
    border:1px solid #ffd400;
    border-radius:18px;
    padding:30px 20px;
}

.success-icon{
    width:60px;
    height:60px;
    line-height:60px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#ffd400;
    color:#06122a;
    font-size:35px;
    font-weight:900;
}

.success h2{
    color:#ffd400;
    margin-bottom:10px;
}

.success p{
    line-height:1.6;
    color:#ddd;
}

.ref{
    margin-top:15px;
    padding:12px;
    background:#06122a;
    border-radius:8px;
    color:#ffd400;
    word-break:break-all;
    font-weight:700;
    font-size:13px;
}

.return-button{
    width:100%;
    height:48px;
    margin-top:18px;
    border:1px solid #ffd400;
    border-radius:10px;
    background:transparent;
    color:#ffd400;
    font-weight:800;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<div class="page">

    <div class="header">

        <img
            class="logo"
            src="https://kulzzy.github.io/app/logo.jpg"
            alt="Kulzzy Radio"
        >

        <h1>
            KULZZY PAYMENT CORE
        </h1>

        <p>
            Secure payment processing for Kulzzy Radio Network
        </p>

    </div>


    <!-- PAYMENT SCREEN -->

    <div
        class="card"
        id="paymentCard"
    >

        <div class="status">

            <span class="status-badge">
                FLUTTERWAVE SECURE PAYMENT
            </span>

        </div>


        <div class="payment-info">

            <div class="payment-info-row">

                <span class="payment-info-label">
                    Payment
                </span>

                <span
                    class="payment-info-value"
                    id="purposeDisplay"
                >
                    Kulzzy Radio Payment
                </span>

            </div>


            <div class="payment-info-row">

                <span class="payment-info-label">
                    Amount
                </span>

                <span
                    class="payment-info-value"
                    id="amountDisplay"
                >
                    ₦0
                </span>

            </div>

        </div>


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
        >


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
        >


        <button
            type="button"
            class="pay-button"
            id="payButton"
        >
            PAY NOW
        </button>


        <div
            class="error-box"
            id="errorBox"
        ></div>


        <div class="notice">

            Your payment will be processed securely
            by Flutterwave.

        </div>

    </div>


    <!-- SUCCESS SCREEN -->

    <div
        class="success"
        id="successBox"
    >

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Payment Verified
        </h2>

        <p>
            Your payment has been successfully
            verified by Kulzzy Radio.
        </p>

        <div
            class="ref"
            id="transactionReference"
        ></div>

        <button
            type="button"
            class="return-button"
            id="returnButton"
        >
            RETURN TO KULZZY
        </button>

    </div>


    <div class="footer">
        STAY TUNED IN
    </div>

</div>


<script>

/* =====================================================
   KULZZY PAYMENT CORE
   ===================================================== */


/* =====================================================
   FLUTTERWAVE PUBLIC KEY

   THIS IS THE SAME PUBLIC KEY FROM YOUR
   CURRENT WORKING PAYMENT PAGE.
   ===================================================== */

const FLUTTERWAVE_PUBLIC_KEY =
"FLWPUBK-b740721cd84bc6766656034a47fc7606-X";


/* =====================================================
   EXISTING KULZZY PAYMENT VERIFICATION BACKEND

   THIS IS THE SAME VERIFICATION URL FROM YOUR
   CURRENT WORKING PAYMENT PAGE.
   ===================================================== */

const VERIFICATION_URL =
"https://script.google.com/macros/s/AKfycby_TG1BdvAw4KEq5bDURsdfvO7V5HpvAPITupYng9hMzOHsyR5-A64iihUt3vR7uzByxQ/exec";


/* =====================================================
   DEFAULT VALUES
   ===================================================== */

const DEFAULT_PURPOSE =
"Kulzzy Radio Payment";

const DEFAULT_RETURN_URL =
"https://kulzzy.github.io/app/";


/* =====================================================
   ELEMENTS
   ===================================================== */

const paymentCard =
document.getElementById("paymentCard");

const successBox =
document.getElementById("successBox");

const purposeDisplay =
document.getElementById("purposeDisplay");

const amountDisplay =
document.getElementById("amountDisplay");

const email =
document.getElementById("email");

const nameInput =
document.getElementById("name");

const phone =
document.getElementById("phone");

const button =
document.getElementById("payButton");

const errorBox =
document.getElementById("errorBox");

const transactionReference =
document.getElementById(
    "transactionReference"
);

const returnButton =
document.getElementById(
    "returnButton"
);


/* =====================================================
   READ PAYMENT REQUEST
   ===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


/* =====================================================
   PAYMENT PURPOSE
   ===================================================== */

const paymentPurpose =
params.get("purpose") ||
DEFAULT_PURPOSE;


/* =====================================================
   PAYMENT AMOUNT
   ===================================================== */

const requestedAmount =
Number(
    params.get("amount")
);


/* =====================================================
   RETURN URL
   ===================================================== */

const returnUrl =
params.get("return") ||
DEFAULT_RETURN_URL;


/* =====================================================
   OPTIONAL CUSTOMER DETAILS
   ===================================================== */

const requestedEmail =
params.get("email") ||
"";

const requestedName =
params.get("name") ||
"";

const requestedPhone =
params.get("phone") ||
"";


/* =====================================================
   OPTIONAL PRODUCT / SERVICE ID
   ===================================================== */

const productId =
params.get("product") ||
"";


/* =====================================================
   DISPLAY PAYMENT DETAILS
   ===================================================== */

purposeDisplay.innerText =
paymentPurpose;


if(
    Number.isFinite(requestedAmount) &&
    requestedAmount > 0
){

    amountDisplay.innerText =
        "₦" +
        requestedAmount.toLocaleString(
            "en-NG"
        );

}else{

    amountDisplay.innerText =
        "Enter amount";

}


/* =====================================================
   PRE-FILL CUSTOMER INFORMATION
   ===================================================== */

if(requestedEmail){

    email.value =
        requestedEmail;

}

if(requestedName){

    nameInput.value =
        requestedName;

}

if(requestedPhone){

    phone.value =
        requestedPhone;

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(message){

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =====================================================
   HIDE ERROR
   ===================================================== */

function hideError(){

    errorBox.innerText =
        "";

    errorBox.style.display =
        "none";

}


/* =====================================================
   GENERATE TRANSACTION REFERENCE
   ===================================================== */

function createTransactionReference(){

    const cleanPurpose =
        paymentPurpose
            .replace(
                /[^a-zA-Z0-9]/g,
                "-"
            )
            .substring(
                0,
                25
            )
            .toUpperCase();


    return (
        "KULZZY-" +
        cleanPurpose +
        "-" +
        Date.now() +
        "-" +
        Math.floor(
            Math.random() * 100000
        )
    );

}


/* =====================================================
   RETURN TO ORIGINAL PAGE
   ===================================================== */

function returnToOrigin(){

    try{

        const safeUrl =
            new URL(
                returnUrl,
                window.location.origin
            );

        window.location.href =
            safeUrl.href;

    }catch(error){

        window.location.href =
            DEFAULT_RETURN_URL;

    }

}


/* =====================================================
   SHOW SUCCESS
   ===================================================== */

function showSuccess(
    reference
){

    paymentCard.classList.add(
        "hidden"
    );

    successBox.style.display =
        "block";

    transactionReference.innerText =
        reference;

}


/* =====================================================
   START PAYMENT
   ===================================================== */

function startPayment(){

    hideError();


    /* ================================================
       CHECK FLUTTERWAVE
       ================================================ */

    if(
        typeof window.FlutterwaveCheckout !==
        "function"
    ){

        showError(
            "Flutterwave payment system has not loaded. Please refresh the page and try again."
        );

        return;

    }


    /* ================================================
       EMAIL
       ================================================ */

    const customerEmail =
        email.value.trim();


    if(!customerEmail){

        showError(
            "Please enter your email address."
        );

        email.focus();

        return;

    }


    /* ================================================
       EMAIL FORMAT
       ================================================ */

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(
        !emailPattern.test(
            customerEmail
        )
    ){

        showError(
            "Please enter a valid email address."
        );

        email.focus();

        return;

    }


    /* ================================================
       AMOUNT
       ================================================ */

    let paymentAmount =
        requestedAmount;


    /*
       If the calling page did not supply an amount,
       allow the customer to use the amount field
       through the ?amount= URL parameter.
    */

    if(
        !Number.isFinite(
            paymentAmount
        ) ||
        paymentAmount <= 0
    ){

        showError(
            "No valid payment amount was supplied."
        );

        return;

    }


    /* ================================================
       CUSTOMER INFORMATION
       ================================================ */

    const customerName =
        nameInput.value.trim();

    const customerPhone =
        phone.value.trim();


    /* ================================================
       DISABLE BUTTON
       ================================================ */

    button.disabled =
        true;

    button.innerText =
        "OPENING PAYMENT...";


    /* ================================================
       TRANSACTION REFERENCE
       ================================================ */

    const txRef =
        createTransactionReference();


    /* ================================================
       FLUTTERWAVE
       ================================================ */

    try{

        window.FlutterwaveCheckout({

            public_key:
                FLUTTERWAVE_PUBLIC_KEY,


            tx_ref:
                txRef,


            amount:
                paymentAmount,


            currency:
                "NGN",


            payment_options:
                "card,banktransfer,ussd,account,nqr,opay",


            customer:{

                email:
                    customerEmail,

                name:
                    customerName,

                phone_number:
                    customerPhone

            },


            meta:{

                payment_purpose:
                    paymentPurpose,

                product:
                    productId,

                return_url:
                    returnUrl

            },


            customizations:{

                title:
                    "Kulzzy Radio",

                description:
                    paymentPurpose,

                logo:
                    "https://kulzzy.github.io/app/logo.jpg"

            },


            callback:
                function(response){

                    console.log(
                        "KULZZY PAYMENT CORE RESPONSE:",
                        response
                    );


                    /* ==================================
                       GET TRANSACTION ID
                       ================================== */

                    const transactionId =
                        response.transaction_id ||
                        response.id ||
                        (
                            response.data &&
                            response.data.id
                        );


                    if(!transactionId){

                        showError(
                            "Flutterwave did not return a transaction ID."
                        );

                        button.disabled =
                            false;

                        button.innerText =
                            "PAY NOW";

                        return;

                    }


                    /* ==================================
                       VERIFY PAYMENT
                       ================================== */

                    button.innerText =
                        "VERIFYING PAYMENT...";


                    /*
                       Send the transaction to the
                       SAME verification backend
                       currently used by Kulzzy.
                    */

                    const verifyUrl =
                        VERIFICATION_URL +
                        "?transaction_id=" +
                        encodeURIComponent(
                            transactionId
                        ) +
                        "&amount=" +
                        encodeURIComponent(
                            paymentAmount
                        ) +
                        "&tx_ref=" +
                        encodeURIComponent(
                            txRef
                        ) +
                        "&email=" +
                        encodeURIComponent(
                            customerEmail
                        ) +
                        "&purpose=" +
                        encodeURIComponent(
                            paymentPurpose
                        ) +
                        "&product=" +
                        encodeURIComponent(
                            productId
                        ) +
                        "&return_url=" +
                        encodeURIComponent(
                            returnUrl
                        );


                    /*
                       The existing backend remains
                       responsible for verification.
                    */

                    window.location.href =
                        verifyUrl;

                },


            onclose:
                function(){

                    button.disabled =
                        false;

                    button.innerText =
                        "PAY NOW";

                }

        });


    }catch(error){

        console.error(
            "KULZZY PAYMENT CORE ERROR:",
            error
        );


        showError(
            "Flutterwave could not open the payment window. Please try again."
        );


        button.disabled =
            false;

        button.innerText =
            "PAY NOW";

    }

}


/* =====================================================
   BUTTON
   ===================================================== */

button.addEventListener(
    "click",
    startPayment
);


/* =====================================================
   RETURN BUTTON
   ===================================================== */

returnButton.addEventListener(
    "click",
    returnToOrigin
);


/* =====================================================
   EXTERNAL PAYMENT API
   ===================================================== */

/*
   THIS IS THE IMPORTANT PART.

   Other Kulzzy payment pages can eventually call:

   KulzzyPayment.open({
       amount: 3000,
       purpose: "Celebration Announcement",
       email: "customer@email.com",
       name: "Customer Name",
       phone: "08000000000",
       product: "celebration",
       returnUrl: "https://example.com/page.html"
   });

   Instead of putting Flutterwave code inside
   every individual payment page.
*/

window.KulzzyPayment = {

    open:function(options = {}){

        const amount =
            Number(
                options.amount
            );

        const purpose =
            options.purpose ||
            DEFAULT_PURPOSE;

        const customerEmail =
            options.email ||
            "";

        const customerName =
            options.name ||
            "";

        const customerPhone =
            options.phone ||
            "";

        const product =
            options.product ||
            "";

        const destination =
            options.returnUrl ||
            window.location.href;


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            alert(
                "KULZZY PAYMENT CORE: Invalid payment amount."
            );

            return;

        }


        const coreUrl =
            window.location.href.split("?")[0];


        const query =
            new URLSearchParams({

                amount:
                    amount,

                purpose:
                    purpose,

                email:
                    customerEmail,

                name:
                    customerName,

                phone:
                    customerPhone,

                product:
                    product,

                return:
                    destination

            });


        window.location.href =
            coreUrl +
            "?" +
            query.toString();

    }

};


/* =====================================================
   KULZZY PAYMENT CORE READY
   ===================================================== */

console.log(
    "KULZZY PAYMENT CORE READY"
);

console.log(
    "Payment Purpose:",
    paymentPurpose
);

console.log(
    "Payment Amount:",
    requestedAmount
);

</script>

</body>
</html>
